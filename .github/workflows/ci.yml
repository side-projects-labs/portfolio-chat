# 검증(lint·타입·테스트·빌드) 후 Vercel에 배포합니다.
#   - 모든 PR과 master push: verify (시크릿 없이 실행, 포크 PR도 실행)
#   - 같은 저장소의 PR: verify 통과 후 preview 배포
#   - master push: verify 통과 후 production 배포 (GitHub Environment 승인 게이트는 쓰지 않음: 병합 권한이 담당자에게만 있음)
# 공개 저장소이므로 포크 PR에는 시크릿을 주지 않고, pull_request_target은 쓰지 않습니다.
# Vercel 토큰은 필요한 단계(pull, deploy)에만 주고, 의존성 설치와 프로젝트 빌드에는 노출하지 않습니다.
# 액션은 공급망 공격을 막기 위해 커밋 SHA로 고정합니다(주석은 해당 태그).
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Vercel CLI 버전은 고정합니다. 올릴 때는 pull·build·deploy 명령이 같은지 확인합니다.
  VERCEL_CLI: vercel@66.6.0

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # 빌드에는 AI 키가 필요 없습니다. 키는 런타임에 서버에서만 읽습니다.
      - run: pnpm build

  preview:
    needs: verify
    # 포크 PR에는 시크릿이 없으므로 같은 저장소의 PR만 배포합니다.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Vercel 환경 정보 가져오기
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: pnpm dlx "$VERCEL_CLI" pull --yes --environment=preview
      - name: 빌드
        run: pnpm dlx "$VERCEL_CLI" build
      - name: 배포
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(pnpm dlx "$VERCEL_CLI" deploy --prebuilt)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: 배포 확인(smoke test)
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          code=0
          bash scripts/smoke.sh "$DEPLOY_URL" || code=$?
          if [ "$code" -eq 3 ]; then
            echo "::notice::배포 보호 때문에 smoke test를 확인하지 못했습니다. VERCEL_AUTOMATION_BYPASS_SECRET 시크릿을 등록하면 확인합니다."
            exit 0
          fi
          exit "$code"

  production:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 배포가 겹치지 않게 하고, 진행 중인 production 배포는 취소하지 않습니다.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Vercel 환경 정보 가져오기
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: pnpm dlx "$VERCEL_CLI" pull --yes --environment=production
      - name: 빌드
        run: pnpm dlx "$VERCEL_CLI" build --prod
      - name: 배포
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(pnpm dlx "$VERCEL_CLI" deploy --prebuilt --prod)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Production: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: 배포 확인(smoke test)
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          code=0
          bash scripts/smoke.sh "$DEPLOY_URL" || code=$?
          if [ "$code" -eq 3 ]; then
            echo "::notice::배포 보호 때문에 smoke test를 확인하지 못했습니다. VERCEL_AUTOMATION_BYPASS_SECRET 시크릿을 등록하면 확인합니다."
            exit 0
          fi
          exit "$code"
